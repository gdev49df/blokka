<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blokka — конструктор сайтов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▦</span> blokka</div>
  <div class="actions">
    <button id="btnPresets" class="ghost">шаблоны</button>
    <button id="btnExport" class="ghost">сохранить проект</button>
    <label class="ghost btn-like">загрузить проект<input id="fileImport" type="file" accept=".json" hidden></label>
    <button id="btnZip" class="primary">скачать сайт (zip)</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" id="panel">
    <div class="tabs">
      <button data-tab="blocks" class="on">блоки</button>
      <button data-tab="site">сайт</button>
    </div>
    <div id="tabBlocks"></div>
    <div id="tabSite" hidden></div>
  </aside>

  <section class="preview">
    <div class="bar">
      <button data-w="100%" class="on">пк</button>
      <button data-w="420px">телефон</button>
      <span class="barhint">кликай по тексту и фото прямо в превью, наведи на блок для управления</span>
    </div>
    <div class="frame-wrap"><iframe id="frame" title="превью"></iframe></div>
  </section>
</main>

<dialog id="dlg"></dialog>
<dialog id="cat"></dialog>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="blocks.js"></script>
<script src="app.js"></script>
</body>
</html>
